name: Build BuiltZygisk

# Builds the NyaZygisk payload that ksud embeds as its built-in Zygisk.
#
# Hosted-runner variant of the old self-hosted job: the submodules come from
# GitHub, SDK/NDK/CMake are installed with sdkmanager, and the payloads travel
# through upload-artifact.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      os:
        required: false
        type: string
        default: ubuntu-latest

jobs:
  build:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        run: |
          set -eux
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;27.2.12479018" \
            "cmake;4.1.2"

      - name: Build BuiltZygisk
        working-directory: external/BuiltZygisk
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          set -eux
          gradle --version | head -3
          gradle --build-cache zipRelease \
            -Porg.gradle.parallel=true \
            -Dorg.gradle.jvmargs=-Xmx2048m

      - name: Organize artifacts
        working-directory: external/BuiltZygisk
        run: |
          set -eux
          zip="$(find module/build/outputs/release -type f -name 'NyaZygisk-v*-release.zip' | head -n 1)"
          test -n "$zip"
          rm -rf extracted "$PWD"/../builtzygisk-*
          mkdir -p extracted
          unzip -q "$zip" -d extracted

          out="${GITHUB_WORKSPACE}/builtzygisk"
          for arch in aarch64 arm x86_64 riscv64; do
            mkdir -p "$out/$arch"
            # Shared by every architecture: the SELinux rules and the module.prop.
            cp module/src/sepolicy.rule "$out/$arch/zygisk-sepolicy.rule"
            cp extracted/module.prop "$out/$arch/zygisk-module.prop"
          done

          # The 64-bit packages also carry the 32-bit loader for a 32-bit zygote.
          copy() {
            [ -f "extracted/$1" ] || return 0
            cp "extracted/$1" "$out/$2/$3"
          }
          copy bin/arm64-v8a/zygiskd            aarch64 zygiskd
          copy lib/arm64-v8a/libzygisk_ptrace.so aarch64 zygisk-ptrace
          copy lib/arm64-v8a/libzygisk.so        aarch64 libzygisk.so
          copy lib/armeabi-v7a/libzygisk.so      aarch64 libzygisk32.so

          copy bin/armeabi-v7a/zygiskd          arm zygiskd
          copy lib/armeabi-v7a/libzygisk_ptrace.so arm zygisk-ptrace
          copy lib/armeabi-v7a/libzygisk.so      arm libzygisk.so

          copy bin/x86_64/zygiskd               x86_64 zygiskd
          copy lib/x86_64/libzygisk_ptrace.so    x86_64 zygisk-ptrace
          copy lib/x86_64/libzygisk.so           x86_64 libzygisk.so
          copy lib/x86/libzygisk.so              x86_64 libzygisk32.so

          copy bin/riscv64/zygiskd              riscv64 zygiskd
          copy lib/riscv64/libzygisk_ptrace.so    riscv64 zygisk-ptrace
          copy lib/riscv64/libzygisk.so           riscv64 libzygisk.so

          for arch in aarch64 arm x86_64 riscv64; do
            test -f "$out/$arch/zygiskd"
            ls -l "$out/$arch"
          done

      - name: Upload aarch64 payload
        uses: actions/upload-artifact@v7
        with:
          name: builtzygisk-aarch64
          path: ${{ github.workspace }}/builtzygisk/aarch64/*
          if-no-files-found: error

      - name: Upload arm payload
        uses: actions/upload-artifact@v7
        with:
          name: builtzygisk-arm
          path: ${{ github.workspace }}/builtzygisk/arm/*
          if-no-files-found: error

      - name: Upload x86_64 payload
        uses: actions/upload-artifact@v7
        with:
          name: builtzygisk-x86_64
          path: ${{ github.workspace }}/builtzygisk/x86_64/*
          if-no-files-found: error

      - name: Upload riscv64 payload
        uses: actions/upload-artifact@v7
        with:
          name: builtzygisk-riscv64
          path: ${{ github.workspace }}/builtzygisk/riscv64/*
          if-no-files-found: error
