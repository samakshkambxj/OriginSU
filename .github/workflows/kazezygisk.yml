name: Build KazeZygisk

# Builds the KazeZygisk payload that ksud embeds as its built-in Zygisk engine.
#
# The engine is the KazeSU fork at external/BuiltZygisk. The hosted job installs
# SDK/NDK/CMake, builds the module ZIP and ships one payload directory per ABI.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      os:
        required: false
        type: string
        default: ubuntu-latest

jobs:
  build:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        run: |
          set -eux
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;27.2.12479018" \
            "cmake;4.1.2"

      # kazezygiskd is cross-compiled by Gradle through `cargo ndk`, and its
      # riscv64 build uses -Zbuild-std, so the engine needs a nightly toolchain.
      - name: Set up Rust
        working-directory: external/BuiltZygisk
        run: |
          set -eux
          rustup override set nightly
          rustup component add rust-src
          rustup target add aarch64-linux-android x86_64-linux-android armv7-linux-androideabi

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Build KazeZygisk
        working-directory: external/BuiltZygisk
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          set -eux
          ./gradlew --version | head -3
          ./gradlew --build-cache zipRelease \
            -Porg.gradle.parallel=true \
            -Dorg.gradle.jvmargs=-Xmx2048m

      - name: Organize artifacts
        working-directory: external/BuiltZygisk
        run: |
          set -eux
          zip="$(find module/build/outputs/release -type f -name 'KazeZygisk-v*-release.zip' | head -n 1)"
          test -n "$zip"
          rm -rf extracted "$PWD"/../kazezygisk-*
          mkdir -p extracted
          unzip -q "$zip" -d extracted

          out="${GITHUB_WORKSPACE}/kazezygisk"
          for arch in aarch64 arm x86_64 riscv64; do
            mkdir -p "$out/$arch"
            # Shared by every architecture: the SELinux rules and the module.prop.
            cp module/src/sepolicy.rule "$out/$arch/kazezygisk-sepolicy.rule"
            cp extracted/module.prop "$out/$arch/kazezygisk-module.prop"
          done

          # The 64-bit packages also carry the 32-bit loader for a 32-bit zygote.
          copy() {
            [ -f "extracted/$1" ] || return 0
            cp "extracted/$1" "$out/$2/$3"
          }
          copy bin/arm64-v8a/kazezygiskd             aarch64 kazezygiskd
          copy lib/arm64-v8a/libkazezygisk_ptrace.so aarch64 kazezygisk-ptrace
          copy lib/arm64-v8a/libkazezygisk.so        aarch64 libkazezygisk.so
          copy lib/armeabi-v7a/libkazezygisk.so      aarch64 libkazezygisk32.so

          copy bin/armeabi-v7a/kazezygiskd          arm kazezygiskd
          copy lib/armeabi-v7a/libkazezygisk_ptrace.so arm kazezygisk-ptrace
          copy lib/armeabi-v7a/libkazezygisk.so      arm libkazezygisk.so

          copy bin/x86_64/kazezygiskd               x86_64 kazezygiskd
          copy lib/x86_64/libkazezygisk_ptrace.so    x86_64 kazezygisk-ptrace
          copy lib/x86_64/libkazezygisk.so           x86_64 libkazezygisk.so
          copy lib/x86/libkazezygisk.so              x86_64 libkazezygisk32.so

          copy bin/riscv64/kazezygiskd              riscv64 kazezygiskd
          copy lib/riscv64/libkazezygisk_ptrace.so    riscv64 kazezygisk-ptrace
          copy lib/riscv64/libkazezygisk.so           riscv64 libkazezygisk.so

          for arch in aarch64 arm x86_64 riscv64; do
            test -f "$out/$arch/kazezygiskd"
          done

          # The manifest ksud verifies the staged payload against. Asset names are the
          # keys, so the hash of `kazezygisk-ptrace` is what `grep kazezygisk-ptrace`
          # finds; keep the list free of the manifest itself.
          for arch in aarch64 arm x86_64 riscv64; do
            (
              cd "$out/$arch"
              rm -f kazezygisk-manifest.sha256
              sha256sum kazezygiskd kazezygisk-ptrace libkazezygisk*.so \
                > kazezygisk-manifest.sha256
            )
            ls -l "$out/$arch"
          done

      - name: Upload aarch64 payload
        uses: actions/upload-artifact@v7
        with:
          name: kazezygisk-aarch64
          path: ${{ github.workspace }}/kazezygisk/aarch64/*
          if-no-files-found: error

      - name: Upload arm payload
        uses: actions/upload-artifact@v7
        with:
          name: kazezygisk-arm
          path: ${{ github.workspace }}/kazezygisk/arm/*
          if-no-files-found: error

      - name: Upload x86_64 payload
        uses: actions/upload-artifact@v7
        with:
          name: kazezygisk-x86_64
          path: ${{ github.workspace }}/kazezygisk/x86_64/*
          if-no-files-found: error

      - name: Upload riscv64 payload
        uses: actions/upload-artifact@v7
        with:
          name: kazezygisk-riscv64
          path: ${{ github.workspace }}/kazezygisk/riscv64/*
          if-no-files-found: error
