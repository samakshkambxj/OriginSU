name: Build ksud
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      os:
        required: false
        type: string
        default: ubuntu-latest
      pack_lkm:
        required: false
        type: boolean
        default: true
      pack_ksuinit:
        required: false
        type: boolean
        default: true
      use_cache:
        required: false
        type: boolean
        default: true
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    name: Build ksud (${{ inputs.target }})
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Prepare LKM fies
        if: ${{ inputs.pack_lkm }}
        run: |
          for d in aarch64-android*-lkm/; do
            case "$d" in *-susfs-lkm/) continue;; esac
            [ -d "$d" ] || continue
            for f in "$d"*_kernelsu.ko; do
              [ -f "$f" ] || continue
              cp "$f" ./userspace/ksud/bin/aarch64/
            done
            for f in "$d"*_nomount.ko; do
              [ -f "$f" ] || continue
              cp "$f" ./userspace/ksud/bin/aarch64/
            done
          done
          for d in aarch64-android*-susfs-lkm/; do
            [ -d "$d" ] || continue
            for f in "$d"*_susfs_guard_lkm.ko; do
              [ -f "$f" ] || continue
              cp "$f" ./userspace/ksud/bin/aarch64/
            done
          done
          cp x86_64-android*-lkm/*_kernelsu.ko ./userspace/ksud/bin/x86_64/
          for d in x86_64-android*-lkm/; do
            [ -d "$d" ] || continue
            for f in "$d"*_nomount.ko; do
              [ -f "$f" ] || continue
              cp "$f" ./userspace/ksud/bin/x86_64/
            done
          done
          for d in aarch64-android*-lkm-tamper/; do
            [ -d "$d" ] || continue
            for f in "$d"*_kernelsu.ko; do
              [ -f "$f" ] || continue
              cp "$f" "./userspace/ksud/bin/aarch64/tamper-$(basename "$f")"
            done
          done
          for d in x86_64-android*-lkm-tamper/; do
            [ -d "$d" ] || continue
            for f in "$d"*_kernelsu.ko; do
              [ -f "$f" ] || continue
              cp "$f" "./userspace/ksud/bin/x86_64/tamper-$(basename "$f")"
            done
          done
          ls ./userspace/ksud/bin/aarch64/ ./userspace/ksud/bin/x86_64/

      - name: Prepare ksuinit
        if: ${{ inputs.pack_ksuinit }}
        run: |
          mv ksuinit-aarch64/ksuinit ./userspace/ksud/bin/aarch64/
          mv ksuinit-x86_64/ksuinit ./userspace/ksud/bin/x86_64/
          mv ksuinit-riscv64/ksuinit ./userspace/ksud/bin/riscv64/

      # Origin Sui ships as a payload embedded in ksud, so the package has to
      # carry it for every ABI it publishes. riscv64 has no Sui payload, and the
      # manager reports "payload missing" there instead of failing.
      - name: Stage the Origin Sui payload
        if: ${{ inputs.target != 'riscv64-linux-android' }}
        run: |
          case "${{ inputs.target }}" in
            aarch64-linux-android) bindir=aarch64 ;;
            armv7-linux-androideabi) bindir=arm ;;
            x86_64-linux-android) bindir=x86_64 ;;
            *) echo "unexpected target: ${{ inputs.target }}" >&2; exit 1 ;;
          esac

          zip=$(ls -t sui-payload/*.zip | head -1)
          version=$(sed -n 's/^version=//p' userspace/sui/payload-version.txt)
          version_code=$(sed -n 's/^version_code=//p' userspace/sui/payload-version.txt)

          python3 userspace/sui/package.py \
            --zip "$zip" \
            --target "$bindir" \
            --assets "userspace/ksud/bin/$bindir" \
            --version "$version" \
            --version-code "$version_code" \
            --force

          test -f "userspace/ksud/bin/$bindir/sui/payload.json"

      - name: Setup Rust toolchain
        if: ${{ inputs.target != 'riscv64-linux-android' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          targets: ${{ inputs.target }}
          components: rust-src
      
      - name: Setup Rust toolchain
        if: ${{ inputs.target == 'riscv64-linux-android' }}
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ksud-v2-${{ inputs.target }}
          workspaces: userspace/ksud
          cache-directories: userspace/ksuinit/target
          cache-targets: true
          add-job-id-key: false
          add-rust-environment-hash-key: false
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Setup cargo-ndk
        if: ${{ inputs.target != 'riscv64-linux-android' }}
        run: cargo install cargo-ndk --locked

      - name: Assemble LKM bootstrap
        run: |
          clang --target=aarch64-linux-gnu -c -nostdlib \
            -o userspace/ksud/.lkm_image_bootstrap.o \
            userspace/ksud/src/lkm_image_bootstrap.S

      - name: Build ksud
        run: |
          if [ "${{github.event_name}}" == "pull_request" ]; then
            export KSU_PACKAGE_NAME="com.originsu.manager.pr${{github.event.pull_request.number}}"
          elif [ "${{github.ref_type}}" != "tag" ] && [ "${{github.ref_name}}" != "main" ]; then
            export KSU_PACKAGE_NAME="com.originsu.manager.dev"
          fi

          if [ "${{ inputs.target }}" == "riscv64-linux-android" ]; then
            source .github/scripts/setup-rust-build.sh riscv64-linux-android 35
            cd userspace/ksud/ 
            cargo +nightly build -Z build-std=std,panic_abort --target "$TRIPLE" --release --manifest-path ./Cargo.toml
          else
            cd userspace/ksud/
            cargo ndk b -P 26 -t ${{ inputs.target }} -r -Z build-std-features="optimize_for_size" -Z trim-paths
          fi

      - name: Upload ksud artifact
        uses: actions/upload-artifact@v7
        with:
          name: ksud-${{ inputs.target }}
          path: userspace/ksud/target/**/release/ksud*
