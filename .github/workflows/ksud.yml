name: Build ksud
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      os:
        required: false
        type: string
        default: ubuntu-latest
      pack_lkm:
        required: false
        type: boolean
        default: true
      pack_ksuinit:
        required: false
        type: boolean
        default: true
      pack_kazezygisk:
        required: false
        type: boolean
        default: true
      use_cache:
        required: false
        type: boolean
        default: true
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    name: Build ksud (${{ inputs.target }})
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Prepare LKM fies
        if: ${{ inputs.pack_lkm }}
        run: |
          for d in aarch64-android*-lkm/; do
            [ -d "$d" ] || continue
            for f in "$d"*_kernelsu.ko; do
              [ -f "$f" ] || continue
              cp "$f" ./userspace/ksud/bin/aarch64/
            done
            for f in "$d"*_nomount.ko; do
              [ -f "$f" ] || continue
              cp "$f" ./userspace/ksud/bin/aarch64/
            done
          done
          cp x86_64-android*-lkm/*_kernelsu.ko ./userspace/ksud/bin/x86_64/
          for d in x86_64-android*-lkm/; do
            [ -d "$d" ] || continue
            for f in "$d"*_nomount.ko; do
              [ -f "$f" ] || continue
              cp "$f" ./userspace/ksud/bin/x86_64/
            done
          done
          ls ./userspace/ksud/bin/aarch64/ ./userspace/ksud/bin/x86_64/

      - name: Prepare ksuinit
        if: ${{ inputs.pack_ksuinit }}
        run: |
          mv ksuinit-aarch64/ksuinit ./userspace/ksud/bin/aarch64/
          mv ksuinit-x86_64/ksuinit ./userspace/ksud/bin/x86_64/
          mv ksuinit-riscv64/ksuinit ./userspace/ksud/bin/riscv64/

      - name: Prepare KazeZygisk
        if: ${{ inputs.pack_kazezygisk }}
        run: |
          set -eux
          for arch in aarch64 arm x86_64 riscv64; do
            src="kazezygisk-$arch"
            [ -d "$src" ] || continue
            [ -d "$src/$arch" ] && src="$src/$arch"
            cp -rf "$src"/. "./userspace/ksud/bin/$arch/"
          done

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - name: Setup Rust toolchain
        if: ${{ inputs.target != 'riscv64-linux-android' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          targets: ${{ inputs.target }}
          components: rust-src
      
      - name: Setup Rust toolchain
        if: ${{ inputs.target == 'riscv64-linux-android' }}
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ksud-v2-${{ inputs.target }}
          workspaces: userspace/ksud
          cache-directories: userspace/ksuinit/target
          cache-targets: true
          add-job-id-key: false
          add-rust-environment-hash-key: false
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Setup cargo-ndk
        if: ${{ inputs.target != 'riscv64-linux-android' }}
        run: cargo install cargo-ndk --locked

      - name: Assemble LKM bootstrap
        run: |
          clang --target=aarch64-linux-gnu -c -nostdlib \
            -o userspace/ksud/.lkm_image_bootstrap.o \
            userspace/ksud/src/lkm_image_bootstrap.S

      - name: Build ksud
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          if [ "${{github.event_name}}" == "pull_request" ]; then
            export KSU_PACKAGE_NAME="com.kazesu.manager.pr${{github.event.pull_request.number}}"
          elif [ "${{github.ref_type}}" != "tag" ] && [ "${{github.ref_name}}" != "main" ]; then
            export KSU_PACKAGE_NAME="com.kazesu.manager.dev"
          fi

          if [ "${{ inputs.target }}" == "riscv64-linux-android" ]; then
            source .github/scripts/setup-rust-build.sh riscv64-linux-android 35
            cd userspace/ksud/ 
            cargo +nightly build -Z build-std=std,panic_abort --target "$TRIPLE" --release --manifest-path ./Cargo.toml
          else
            cd userspace/ksud/
            cargo ndk b -P 26 -t ${{ inputs.target }} -r -Z build-std-features="optimize_for_size" -Z trim-paths
          fi

      - name: Upload ksud artifact
        uses: actions/upload-artifact@v7
        with:
          name: ksud-${{ inputs.target }}
          # ksud is a member of the root cargo workspace, so the binary
          # lands in <repo>/target/<triple>/release, not userspace/ksud/target.
          path: target/${{ inputs.target }}/release/ksud*
