name: Release (hosted)

# Builds the manager APK on a GitHub-hosted runner. The full pipeline in
# release.yml expects the self-hosted runner with its /ci volume; this workflow
# only needs the standard hosted toolchain and publishes to GitHub Releases.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        run: |
          set -eux
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-09-23
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Write signing key
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eux
          echo "$KEYSTORE" | tr -d ' \t\r\n' | base64 -d > manager/key.jks
          {
            echo "KEYSTORE_FILE=key.jks"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> manager/gradle.properties

      - name: Build ksud
        run: |
          set -eux
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/29.0.14206865"
          for target in aarch64-linux-android armv7-linux-androideabi x86_64-linux-android; do
            # shellcheck disable=SC1091
            source .github/scripts/setup-rust-build.sh "$target" 26
            cargo build --target "$target" --release \
              --manifest-path userspace/ksud/Cargo.toml
          done
          ls -l target/*/release/ksud

      - name: Copy ksud into the manager
        run: |
          set -eux
          cd manager

          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          mkdir -p app/src/main/jniLibs/x86_64

          rand_alpha() {
            openssl rand -base64 48 | tr -dc 'a-z' | cut -c1-"$1"
          }
          KSUD_LIB="lib$(rand_alpha 10).so"
          CORE_LIB="$(rand_alpha 11)"
          APP_CLASS="$(rand_alpha 11)"
          PRELOAD_CLASS="$(rand_alpha 11)"
          MAIN_CLASS="$(rand_alpha 11)"
          WEBUI_CLASS="$(rand_alpha 11)"
          DOWNLOAD_CLASS="$(rand_alpha 11)"
          MAGICA_CLASS="$(rand_alpha 11)"

          find app/src/main -type f \
            \( -name '*.kt' -o -name '*.java' -o -name '*.xml' \
               -o -name '*.cc' -o -name 'CMakeLists.txt' \) \
            -exec sed -i \
              -e "s/\"libksud\.so\"/\"$KSUD_LIB\"/g" \
              -e "s/project(\"kernelsu\")/project(\"$CORE_LIB\")/" \
              -e "s/add_library(kernelsu/add_library($CORE_LIB/" \
              -e "s/target_include_directories(kernelsu /target_include_directories($CORE_LIB /" \
              -e "s/target_link_libraries(kernelsu /target_link_libraries($CORE_LIB /" \
              -e "s/loadLibrary(\"kernelsu\")/loadLibrary(\"$CORE_LIB\")/g" \
              -e "/^[[:space:]]*[*\/]/!s/KernelSUApplication/${APP_CLASS}Application/g" \
              -e "/^[[:space:]]*[*\/]/!s/AppZygotePreload/${PRELOAD_CLASS}Preload/g" \
              -e "/^[[:space:]]*[*\/]/!s/MainActivity/${MAIN_CLASS}Activity/g" \
              -e "/^[[:space:]]*[*\/]/!s/WebUIActivity/${WEBUI_CLASS}Activity/g" \
              -e "/^[[:space:]]*[*\/]/!s/DownloadService/${DOWNLOAD_CLASS}Service/g" \
              -e "/^[[:space:]]*[*\/]/!s/MagicaService/${MAGICA_CLASS}Service/g" \
              {} +

          find app/src/main -depth -type f -name 'KernelSUApplication.kt' \
            -execdir mv {} "${APP_CLASS}Application.kt" \;
          find app/src/main -depth -type f -name 'AppZygotePreload.java' \
            -execdir mv {} "${PRELOAD_CLASS}Preload.java" \;
          find app/src/main -depth -type f -name 'MainActivity.kt' \
            -execdir mv {} "${MAIN_CLASS}Activity.kt" \;
          find app/src/main -depth -type f -name 'MainActivityUiState.kt' \
            -execdir mv {} "${MAIN_CLASS}ActivityUiState.kt" \;
          find app/src/main -depth -type f -name 'MainActivityViewModel.kt' \
            -execdir mv {} "${MAIN_CLASS}ActivityViewModel.kt" \;
          find app/src/main -depth -type f -name 'WebUIActivity.kt' \
            -execdir mv {} "${WEBUI_CLASS}Activity.kt" \;
          find app/src/main -depth -type f -name 'DownloadService.kt' \
            -execdir mv {} "${DOWNLOAD_CLASS}Service.kt" \;
          find app/src/main -depth -type f -name 'MagicaService.java' \
            -execdir mv {} "${MAGICA_CLASS}Service.java" \;

          cp -f ../target/aarch64-linux-android/release/ksud \
            "app/src/main/jniLibs/arm64-v8a/$KSUD_LIB"
          cp -f ../target/armv7-linux-androideabi/release/ksud \
            "app/src/main/jniLibs/armeabi-v7a/$KSUD_LIB"
          cp -f ../target/x86_64-linux-android/release/ksud \
            "app/src/main/jniLibs/x86_64/$KSUD_LIB"

      - name: Build APK
        working-directory: manager
        run: |
          set -eux
          mkdir -p ../dist
          ./gradlew --no-daemon --build-cache assembleRelease
          find app/build/outputs/apk/release -type f -name '*.apk' -exec cp -f {} ../dist/ \;
          ls -lh ../dist

      - name: Build spoofed APK
        working-directory: manager
        run: |
          set -eux
          # Random package name per build, same scheme the legacy pipeline used:
          # three lowercase words so the manager installs beside the real one.
          word1=$(tr -dc 'a-z' </dev/urandom | head -c6)
          word2=$(tr -dc 'a-z' </dev/urandom | head -c6)
          word3=$(tr -dc 'a-z' </dev/urandom | head -c6)
          export KSU_PACKAGE_NAME="${word1}.${word2}.${word3}"
          echo "spoofed package: ${KSU_PACKAGE_NAME}"
          ./gradlew --no-daemon --build-cache assembleRelease \
            -PKSU_PACKAGE_NAME="$KSU_PACKAGE_NAME" -PIS_SPOOFED_BUILD=true
          APK=$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n1)
          test -n "$APK"
          cp -f "$APK" ../dist/spoofed.apk
          ls -lh ../dist

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: KazeSU-${{ github.ref_name }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Build changelog
        if: github.ref_type == 'tag'
        run: |
          set -eux
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi
          {
            printf '## What changed in %s\n\n' "${GITHUB_REF_NAME}"
            git log "$RANGE" --no-merges --pretty=format:'- %s (%h)' --reverse
            printf '\n'
          } > CHANGELOG.md
          cat CHANGELOG.md

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          generate_release_notes: false
          body_path: CHANGELOG.md
          files: |
            dist/KazeSU_*.apk

      - name: Post to Telegram
        if: github.ref_type == 'tag'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ vars.CHAT_ID }}
          TITLE: KazeSU ${{ github.ref_name }}
          VERSION: ${{ github.ref_name }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eux
          # Both variants: the spoofed APK only ships through Telegram and the
          # workflow artifacts, exactly like the legacy pipeline.
          bash scripts/upload-telegram.sh dist/*.apk
