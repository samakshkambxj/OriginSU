android.experimental.enableNewResourceShrinker.preciseShrinking=true
android.enableAppCompileTimeRClass=true
android.useAndroidX=true
# Tuned for 8-thread / 7.5GB RAM machine: cap heap + workers to avoid swap thrash,
# reuse caches across builds, keep Kotlin compiler in-process to save a daemon.
org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.workers.max=4
org.gradle.caching=true
org.gradle.vfs.watch=true
org.gradle.daemon=true
org.gradle.configuration-cache=true
org.gradle.tooling.parallel=true
kotlin.incremental=true
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx1g
android.r8.maxWorkers=2
